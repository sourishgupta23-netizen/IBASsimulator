<style>
:root{--paper:#fff;--line:#e4e4e0;--muted:#6f6f6b;--ink:#111;--bar:56px}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);font:500 13px 'Inter','Helvetica Neue',Arial,sans-serif}
.bar{height:calc(var(--bar) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 24px 0;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);background:var(--paper)}
.mark{font:600 15px 'Space Grotesk',sans-serif;letter-spacing:-.01em;white-space:nowrap}.mark small{font:400 11px 'Inter',sans-serif;color:var(--muted);margin-left:8px}
.tg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border:1px solid var(--ink);border-radius:99px;background:#fff;box-shadow:0 0 0 4px #1111110d}
.tg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:99px;background:var(--ink);transition:transform .28s cubic-bezier(.4,0,.2,1)}
.tg[data-m="2d"] i{transform:translateX(100%)}
.tg button{position:relative;z-index:1;border:0;background:none;font:600 12px 'Space Grotesk','Inter',sans-serif;letter-spacing:.06em;padding:9px 22px;border-radius:99px;color:var(--ink);cursor:pointer;transition:color .25s;white-space:nowrap}
.tg button[aria-pressed="true"]{color:#fff}.tg button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.stage{height:calc(100dvh - var(--bar) - env(safe-area-inset-top,0px));position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}iframe.on{display:block}
@media(max-width:560px){.bar{padding-left:12px;padding-right:12px}.mark small{display:none}.tg button{padding:9px 16px}}
</style></head><body>
<div class="bar"><div class="mark">IBAS<small>Intelligent Blind-Spot Awareness System</small></div>
<div class="tg" id="tg" data-m="3d" role="group" aria-label="Simulation mode"><i></i><button id="b3" aria-pressed="true">3D RIDE</button><button id="b2" aria-pressed="false">2D ROOM</button></div></div>

<script>
const SRC={d3:"<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>IBAS 3D Traffic Lab<\/title><link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"><link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin><link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap\" rel=\"stylesheet\"><style>:root{--paper:#fff;--surface:#f6f6f4;--line:#e4e4e0;--muted:#6f6f6b;--ink:#111;--signal:#d92d20;--display:'Space Grotesk','Helvetica Neue',Arial,sans-serif;--body:'Inter','Helvetica Neue',Arial,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}\n*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:400 14px/1.55 var(--body);-webkit-font-smoothing:antialiased}\n.app{max-width:1240px;margin:0 auto;padding:40px 24px 24px}\n.header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}\n.brand{display:flex;align-items:center;gap:16px}.logo{width:40px;height:40px;border:1px solid var(--ink);border-radius:6px;display:grid;place-items:center;font:600 20px var(--display)}\n.brand h1{font:600 22px/1.15 var(--display);letter-spacing:-.02em;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}\n.pill{font:500 10px var(--mono);letter-spacing:.08em;border:1px solid var(--line);color:var(--muted);padding:8px 12px;border-radius:99px}\n.viewport{height:clamp(420px,56vw,680px);position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#dfe9f2}\ncanvas{display:block;width:100%;height:100%;outline:none}\n.hud{position:absolute;inset:0;pointer-events:none;padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}.hudrow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:flex-start}\n.chip,.speed{background:#ffffffe8;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:11px;color:var(--muted)}.chip strong{display:block;font:600 12px var(--display);letter-spacing:.06em;color:var(--ink)}\n.speed{text-align:center;min-width:92px}.speed b{display:block;font:600 26px/1.1 var(--display);color:var(--ink)}.speed span{font-size:9px;letter-spacing:.08em}\n#alertBox{align-self:flex-start;text-align:center;padding:8px 16px;border-radius:8px;font:600 12px var(--display);letter-spacing:.04em;background:#fffffff0;border:1px solid var(--line);color:var(--ink);max-width:46%}\n#alertBox.near{border-color:#e0a100}#alertBox.crit{background:var(--signal);border-color:var(--signal);color:#fff}\n#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}.tag{position:absolute;transform:translate(-50%,-130%);font:500 10px/1 var(--mono);padding:4px 6px;border-radius:5px;background:#fff;border:1px solid var(--ink);color:var(--ink);white-space:nowrap}\n#flash{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px 18px #d92d2099;opacity:0;transition:opacity .12s}\n.hudcol{display:flex;flex-direction:column;gap:6px}.out{display:flex;gap:8px;align-items:center;font:500 10px var(--mono);color:var(--ink)}\n.vb{width:64px;height:6px;background:var(--line);border-radius:4px;overflow:hidden}.vb i{display:block;height:100%;width:0;background:#e0a100}\n.pt{pointer-events:auto;display:flex;gap:4px;align-items:center}.pt button{padding:7px 10px;font-size:11px;background:#ffffffee}.pt button.on{background:var(--ink);color:#fff;border-color:var(--ink)}.pt .ib{font-size:15px;padding:7px 16px}\n.badge{padding:2px 8px;border-radius:4px;background:var(--surface);border:1px solid var(--line)}.badge.on{background:var(--signal);border-color:var(--signal);color:#fff}\nbutton,.select{font:500 12px var(--body);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 14px;cursor:pointer;transition:border-color .15s,background .15s}\nbutton:hover{border-color:var(--ink)}button.primary,button.active{background:var(--ink);color:#fff;border-color:var(--ink)}button.danger{color:var(--signal)}.select{width:100%;appearance:auto}\n.grid2{display:grid;grid-template-columns:minmax(300px,440px) 1fr;gap:24px;margin-top:24px}.below{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;margin-top:24px}\n.panel{border:1px solid var(--line);border-radius:10px;padding:24px;min-width:0}\n.panel h2{font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;margin:0 0 16px;color:var(--ink)}.panel h2 small{color:var(--muted);font-weight:400;letter-spacing:.02em;text-transform:none;font-size:11px;margin-left:4px}\n.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:16px 0 8px;font-size:12px;color:var(--muted)}.val{font:500 12px var(--mono);color:var(--ink)}\n.range{width:100%;accent-color:var(--ink)}.buttons,.toggle{display:flex;gap:8px;flex-wrap:wrap}.buttons button,.toggle button{flex:1;min-width:84px}\n.chk{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink);margin-top:16px}.chk input{accent-color:var(--ink)}\n.note{font-size:12px;color:var(--muted);margin:16px 0 0}\ncanvas#lcdMirror{width:100%;height:auto;border-radius:10px;border:1px solid var(--ink);background:#07201d;aspect-ratio:4/3}\n.resp{display:grid;grid-template-columns:1fr 1fr;gap:24px}.resp .l h3{font:600 30px/1.1 var(--display);letter-spacing:-.025em;margin:8px 0 16px}.eyebrow{font:500 10px var(--mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}\n.resp p{margin:0 0 16px;color:var(--muted)}#respCode{font:500 11px/1.6 var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:16px}.fine{font:500 10px/1.6 var(--mono);color:var(--signal);letter-spacing:.04em;text-transform:uppercase}\n.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}.kv div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;font:500 9px var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}.kv b{display:block;font:500 12px var(--mono);margin-top:8px;color:var(--ink);letter-spacing:.02em}.kv b.alert{color:var(--signal)}\ndetails{margin-top:24px;border-top:1px solid var(--line);padding-top:16px}summary{cursor:pointer;font:500 12px var(--body)}pre#log{height:130px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;font:11px/1.6 var(--mono);color:var(--ink);margin:16px 0 0;white-space:pre-wrap}\n.footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:40px;padding-top:24px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}\n@media(max-width:900px){.grid2,.resp{grid-template-columns:1fr}}\n@media(max-width:560px){.app{padding:24px 16px 16px}.hud{padding:8px}#alertBox{max-width:100%;order:3;flex-basis:100%}.panel{padding:16px}.pt button{padding:6px 8px}.chip{padding:6px 8px}.resp .l h3{font-size:24px}.speed{min-width:70px}.speed b{font-size:20px}}\n<\/style><\/head><body><div class=\"app\">\n<header class=\"header\"><div class=\"brand\"><div class=\"logo\">I<\/div><div><h1>IBAS 3D Traffic Lab<\/h1><p>Intelligent Blind-Spot Awareness System \u00b7 same-direction traffic \u00b7 simulated sensing<\/p><\/div><\/div><div class=\"pill\" id=\"testPill\">IBAS LOGIC ACTIVE<\/div><\/header>\n<section class=\"viewport\" id=\"viewport\"><canvas id=\"scene\" tabindex=\"0\"><\/canvas><div id=\"flash\"><\/div><div id=\"tags\"><\/div>\n<div class=\"hud\">\n<div class=\"hudrow\"><div class=\"chip\"><strong id=\"viewLabel\">RIDER VIEW<\/strong><span id=\"runState\">Running<\/span> \u00b7 <span id=\"trafficLabel\"><\/span><\/div><div class=\"speed\"><b id=\"hudSpeed\">20<\/b><span>KM/H \u00b7 RIDING<\/span><\/div><div id=\"alertBox\">ROAD CLEAR<\/div><\/div>\n<div class=\"hudrow\" style=\"align-items:flex-end\">\n<div class=\"chip hudcol\"><div class=\"out\">L VIB <div class=\"vb\"><i id=\"hudL\"><\/i><\/div><span id=\"hudLv\">0<\/span><\/div><div class=\"out\">R VIB <div class=\"vb\"><i id=\"hudR\"><\/i><\/div><span id=\"hudRv\">0<\/span><\/div><div class=\"out\">BUZZER <span class=\"badge\" id=\"hudBuz\">OFF<\/span><\/div><\/div>\n<div class=\"pt\" id=\"looks\"><button data-y=\"0\">\u25b2 Ahead<\/button><button data-y=\"1.35\">\u25c0 Left<\/button><button data-y=\"3.05\">\u25bc Back<\/button><button data-y=\"-1.35\">Right \u25b6<\/button><\/div>\n<div class=\"pt\"><button class=\"ib\" id=\"indL\" title=\"Left indicator (Q)\">\u25c0<\/button><button class=\"ib\" id=\"indR\" title=\"Right indicator (E)\">\u25b6<\/button><\/div><\/div><\/div><\/section>\n<section class=\"grid2\">\n<div class=\"panel\"><h2>Handlebar LCD <small>live mirror<\/small><\/h2><canvas id=\"lcdMirror\" width=\"640\" height=\"480\"><\/canvas><\/div>\n<div class=\"panel\"><h2>System response <small>simulated<\/small><\/h2><div class=\"resp\"><div class=\"l\"><div class=\"eyebrow\">Current system response \u00b7 simulated<\/div><h3 id=\"respTitle\">No alert.<\/h3><p id=\"respText\">No simulated vehicle is inside its modelled sensing range.<\/p><div id=\"respCode\"><\/div><div class=\"fine\">Model output only \u00b7 PWM values are requested software levels, not measured vibration intensity or physical pin output.<\/div><\/div>\n<div class=\"kv\"><div>Left vibration request<b id=\"oL\">OFF \u00b7 REQUEST 0<\/b><\/div><div>Right vibration request<b id=\"oR\">OFF \u00b7 REQUEST 0<\/b><\/div><div>Buzzer<b id=\"oBuz\">OFF<\/b><\/div><div>Rear status<b id=\"oRear\">CLEAR<\/b><\/div><div>Turn indicator<b id=\"oInd\">OFF<\/b><\/div><div>Nearest TTC<b id=\"oTtc\">\u2014<\/b><\/div><div>Vehicles in range<b id=\"oRange\">0 / 0 IN RANGE<\/b><\/div><\/div><\/div>\n<details><summary>Show session events<\/summary><pre id=\"log\"><\/pre><\/details><\/div>\n<\/section>\n<section class=\"below\">\n<div class=\"panel\"><h2>Traffic scenario <small>all traffic travels with the bicycle<\/small><\/h2><select id=\"preset\" class=\"select\"><option value=\"low\">Low traffic<\/option><option value=\"medium\" selected>Medium traffic<\/option><option value=\"high\">High traffic<\/option><option value=\"fast\">Fast traffic<\/option><option value=\"slow\">Slow / congested<\/option><option value=\"mixed\">Mixed traffic<\/option><option value=\"overtake\">Rear approach &amp; overtaking<\/option><option value=\"custom\">Manual / custom<\/option><\/select>\n<div class=\"row\"><label for=\"count\">Vehicle count<\/label><span class=\"val\" id=\"countVal\">12<\/span><\/div><input id=\"count\" class=\"range\" type=\"range\" min=\"2\" max=\"24\" value=\"12\">\n<div class=\"row\"><label for=\"trafficSpeed\">Traffic speed<\/label><span class=\"val\" id=\"trafficSpeedVal\">45 km/h<\/span><\/div><input id=\"trafficSpeed\" class=\"range\" type=\"range\" min=\"10\" max=\"100\" value=\"45\">\n<div class=\"row\"><label for=\"density\">Traffic bunching<\/label><span class=\"val\" id=\"densityVal\">65%<\/span><\/div><input id=\"density\" class=\"range\" type=\"range\" min=\"20\" max=\"100\" value=\"65\">\n<p class=\"note\">Vehicles keep real positions and speeds relative to the bicycle; every distance shown is computed from those positions (no random numbers). Scenarios are seeded, so Reset repeats them exactly.<\/p><\/div>\n<div class=\"panel\"><h2>Simulation controls<\/h2><div class=\"buttons\"><button id=\"play\" class=\"primary\">\u25b6 Play<\/button><button id=\"pause\">\u2161 Pause<\/button><button id=\"reset\" class=\"danger\">\u21bb Reset<\/button><\/div>\n<h2 style=\"margin-top:24px\">Camera<\/h2><div class=\"toggle\"><button id=\"follow\" class=\"active\">\u25ce Rider view<\/button><button id=\"orbit\">\u25c8 3D view<\/button><button id=\"overhead\">\u25a6 Overhead<\/button><\/div>\n<div class=\"row\"><label for=\"riderSpeed\">Your bicycle speed<\/label><span class=\"val\" id=\"riderSpeedVal\">20 km/h<\/span><\/div><input id=\"riderSpeed\" class=\"range\" type=\"range\" min=\"0\" max=\"60\" value=\"20\">\n<label class=\"chk\"><input type=\"checkbox\" id=\"zonesChk\" checked> Show radar ranges on the road<\/label><label class=\"chk\"><input type=\"checkbox\" id=\"sound\"> Buzzer sound<\/label>\n<p class=\"note\">Keys: <b>Q<\/b>/<b>E<\/b> indicators \u00b7 <b>Space<\/b> play/pause \u00b7 hold <b>A<\/b>/<b>D<\/b>/<b>S<\/b> (or arrows) to look left/right/back. In 3D view, drag to orbit and scroll to zoom. You can also click the small buttons on the 3D handlebar grips.<\/p><\/div>\n<\/section>\n<div class=\"footer\"><span>IBAS Traffic Lab \u00b7 simulation of the proposed system \u2014 not proof of real radar performance<\/span><span>Needs internet for Three.js (CDN)<\/span><\/div><\/div>\n<script type=\"module\">\nimport * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';\nconst canvas=document.querySelector('#scene'),viewport=document.querySelector('#viewport');\nconst renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;\nconst scene=new THREE.Scene();scene.background=new THREE.Color(0x94c8ef);scene.fog=new THREE.Fog(0x94c8ef,100,310);\nconst camera=new THREE.PerspectiveCamera(67,1,.1,700);camera.position.set(0,1.72,4.3);\nscene.add(new THREE.HemisphereLight(0xd9efff,0x58634e,1.8));const sun=new THREE.DirectionalLight(0xfff0d9,3.2);sun.position.set(-35,60,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-60;sun.shadow.camera.right=60;sun.shadow.camera.top=80;sun.shadow.camera.bottom=-80;scene.add(sun);\nconst mat=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});\nconst asphalt=mat(0x343a3d,.94),pai -gradient(circle at 12px 12px,#8b95a7 0 2.5px,rgba(0,0,0,.55) 3px,transparent 4.6px),\n    radial-gradient(circle at calc(100% - 12px) 12px,#8b95a7 0 2.5px,rgba(0,0,0,.55) 3px,transparent 4.6px),\n    radial-gradient(circle at 12px calc(100% - 12px),#8b95a7 0 2.5px,rgba(0,0,0,.55) 3px,transparent 4.6px),\n    radial-gradient(circle at calc(100% - 12px) calc(100% - 12px),#8b95a7 0 2.5px,rgba(0,0,0,.55) 3px,transparent 4.6px)}\n.vents{position:absolute;top:8px;right:34px;display:flex;gap:4px;pointer-events:none}\n.vents i{width:4px;height:24px;border-radius:9999px;background:var(--muted);box-shadow:inset 1px 1px 2px rgba(0,0,0,.18)}\n.feedback .vents i{background:#1b2123;box-shadow:inset 1px 1px 2px rgba(0,0,0,.6)}\n\n/* ---------- LED ---------- */\n.led{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--phos);box-shadow:var(--glow-green);margin-right:8px;vertical-align:0;animation:pulse 2s ease-in-out infinite}\n\n/* ---------- masthead ---------- */\n.masthead{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 32px}\n.brand{display:flex;align-items:center;gap:14px}\n.brandmark{width:44px;height:44px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;border:1px solid rgba(255,255,255,.25);box-shadow:var(--sh-accent)}\n.brandmark .ic{width:22px;height:22px;stroke-width:2.5}\n.brandname{font:800 22px/1 var(--sans);letter-spacing:-.03em;text-shadow:0 1px 0 #fff}\n.brandname small{display:block;font:500 11px/1.3 var(--mono);letter-spacing:.08em;color:var(--text-muted);margin-top:7px;text-shadow:none}\n.mast-right{display:flex;align-items:center;gap:20px;color:var(--text-muted);font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.08em}\n\n/* ---------- intro ---------- */\n.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(260px,.7fr);align-items:end;gap:36px;padding:52px 0 40px}\n.eyebrow{font:700 11px/1.4 var(--mono);letter-spacing:.08em;text-trans dow:none;background:#202a2f;color:#b8efce;max-height:210px}\n.footer{margin-top:26px;padding-top:18px;box-shadow:none;font-size:10px;text-transform:none;letter-spacing:0}\n.modal-backdrop{backdrop-filter:blur(2px)}\n.modal{padding:28px 24px 22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}\n.modal h2{text-shadow:none;font-size:25px}\n.modal .step-label{margin:16px 0 8px}\n.choice{min-height:58px;box-shadow:var(--sh-sm)}\n.choice span{font-size:10px}\n.toast{box-shadow:0 8px 24px rgba(0,0,0,.2);text-shadow:none}\n.danger-button{color:#a91f2d;border:1px solid rgba(217,54,69,.22);background:#f9e6e8}\n.button-row{display:flex;gap:8px;flex-wrap:wrap}\n.button-row button{flex:1}\n.visually-hidden{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}\n@media(max-width:1100px){.workspace{grid-template-columns:minmax(0,1.35fr) minmax(300px,.85fr);gap:16px}.stage-actions{gap:6px}}\n@media(max-width:950px){.workspace{grid-template-columns:1fr}.side-card{display:grid;grid-template-columns:1fr 1fr;column-gap:20px}.side-head,.carlist-wrap{grid-column:1/-1}.scene{height:420px}.feedback-wide{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)}}\n@media(max-width:600px){.masthead{padding:14px 16px}.mast-right{font-size:9px}.intro{padding:26px 0 20px}.intro h1{font-size:2.35rem}.workspace,.lower{gap:14px}.stage-card{padding:20px 10px 12px}.stage-actions>*{flex:1 1 calc(50% - 4px)}.stage-actions .add-btn{flex-basis:100%}.scene-wrap{padding:6px}.scene{height:370px}.car{width:40px;height:60px}.car .car-id{font-size:9px}.feedback-wide{padding:20px 14px;grid-template-columns:1fr}.haptic-readouts{gap:7px}.haptic-unit{padding:9px}.side-card{display:flex;padding:20px 14px 16px}.lower-card{padding:20px 12px 14px}.modal{padding:24px 16px 18px}.choices{gap:7px}.choice{padding:10px 4px;min-height:56px}.footer{gap:6px}}\n@media(prefers-reduced-motion:reduce){.shell>*{animation:none!important}}\n\n\n/* ---------- step 1: type ---------- */\n.brandname,.intro h1,.stage-title,.side-head h2,.lower-card h2,.feedback h3,.modal h2{font-family:var(--serif);font-weight:400;letter-spacing:-.015em;font-optical-sizing:auto;text-shadow:none}\n.intro h1{font-weight:300;letter-spacing:-.025em}\n/* the font shorthand resets numeric variants, so tabular figures are set last */\n.number,.haptic-unit strong,.zone-table th,.zone-table td,.zone-chip,.car-info small,.range-labels,.stage-meta,.stage-foot,.output-code,.test-result,.toast,.log,.control-note,.lane-tag,.car-id{font-variant-numeric:tabular-nums}\n<\/style>\n<\/head>\n<body>\n<div class=\"shell\">\n<header class=\"masthead\">\n <div class=\"brand\"><div class=\"brandmark\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M7 7h10v10M7 17 17 7\"/><\/svg><\/div><div class=\"brandname\">Roadroom<small>IBAS FIELD SIMULATOR / 01<\/small><\/div><\/div>\n <div class=\"mast-right\"><span><i class=\"led\"><\/i><span id=\"runStatus\">Paused<\/span><\/span><span>CLASSROOM PROTOTYPE<\/span><\/div>\n<\/header>\n<section class=\"intro\">\n <div><div class=\"eyebrow\">Intelligent Blind-Spot Awareness System<\/div><h1>IBAS <em>traffic simulator<\/em><\/h1><\/div>\n <div class=\"intro-note\">Set up nearby traffic, run motion scenarios, and inspect detection ranges, time-to-collision (TTC), and rule-based alerts. This is a browser-based rule simulation\u2014not a physical radar, CARLA, or measured hardware.<\/div>\n<\/section>\n<div class=\"workspace\">\n <section class=\"stage-card\">\n  <div class=\"vents\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n  <div class=\"stage-top\"><div><div class=\"stage-title\">Traffic scene<\/div><div class=\"stage-meta\">Simulated vehicles \u00b7 select a vehicle to edit distance and relative speed<\/div><\/div><div class=\"stage-actions\"><button class=\"ghost active\" id=\"view2d\">2D view<\/button><button class=\"ghost\" id=\"view3d\">Perspective view <svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"width:14px;height:14px\"><path d=\"M7 7h10v10M7 17 17 7\"/><\/svg><\/button><button class=\"ghost\" id=\"runSim\">\u25b6 Run traffic<\/button><button class=\"ghost\" id=\"clearVehicles\">Clear vehicles<\/button><button class=\"secondary danger-button\" id=\"resetSim\">Reset scene<\/button><button class=\"add-btn\" id=\"openAdd\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12h14M12 5v14\"/><\/svg>Add vehicle<\/button><\/div><\/div>\n  <div class=\"scene-legend\" aria-label=\"Scene legend\"><span><i class=\"key\"><\/i>Left-side vehicle<\/span><span><i class=\"key orange\"><\/i>Right-side vehicle<\/span><span><i class=\"key red\"><\/i>Rear danger zone<\/span><span><i class=\"key cyan\"><\/i>Simulated return marker<\/span><\/div><div class=\"scene-wrap\" id=\"sceneWrap\"><div class=\"scene\" id=\"scene\">\n   <div class=\"lane-line l1\"><\/div><div class=\"lane-line mid\"><\/div><div class=\"lane-line l2\"><\/div>\n   <div class=\"lane-tag left\">LEFT / ADJACENT<\/div><div class=\"lane-tag center\">RIDER<\/div><div class=\"lane-tag right\">RIGHT / ADJACENT<\/div>\n   <div class=\"detection left\"><\/div><div class=\"detection right\"><\/div>\n   <div class=\"bike\" aria-label=\"Bicycle facing forward\">\n    <svg viewBox=\"0 0 68 128\" role=\"img\" aria-label=\"Top-down bicycle facing the top of the screen\">\n     <ellipse cx=\"34\" cy=\"18\" rx=\"10\" ry=\"15\" fill=\"#1b2123\" stroke=\"#e0e5ec\" stroke-width=\"2\"/>\n     <ellipse cx=\"34\" cy=\"108\" rx=\"10\" ry=\"15\" fill=\"#1b2123\" stroke=\"#e0e5ec\" stroke-width=\"2\"/>\n     <path d=\"M34 20 L17 63 L34 106 L51 63 Z\" fill=\"none\" stroke=\"#e0e5ec\" stroke-width=\"3\"/>\n     <path d=\"M17 63 L51 63 M34 20 L51 63 M34 20 L17 63\" fill=\"none\" stroke=\"#8e9ab0\" stroke-width=\"2\"/>\n     <circle cx=\"34\" cy=\"20\" r=\"5\" fill=\"#e0e5ec\" stroke=\"#2d3436\" stroke-width=\"2\"/>\n     <circle cx=\"34\" cy=\"63\" r=\"6\" fill=\"#ff4757\" stroke=\"#2d3436\" stroke-width=\"2\"/>\n     <circle cx=\"34\" cy=\"106\" r=\"5\" fill=\"#e0e5ec\" stroke=\"#2d3436\" stroke-width=\"2\"/>\n     <path d=\"M20 13 L48 13\" stroke=\"#e0e5ec\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n     <path d=\"M22 116 L46 116\" stroke=\"#e0e5ec\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n     <path d=\"M27 49 L41 49 L43 57 L25 57 Z\" fill=\"#a8b2d1\" stroke=\"#2d3436\" stroke-width=\"1.5\"/>\n    <\/svg>\n   <\/div><div class=\"bike-caption\">RIDER / FORWARD \u2191<\/div>\n   <div class=\"sensor-pin left\"><\/div><div class=\"sensor-pin right\"><\/div>\n   <div id=\"carsLayer\"><\/div>\n   <div class=\"empty-hint\" id=\"emptyHint\">NO TRAFFIC PLACED \u2014 ADD A VEHICLE TO BEGIN<\/div>\n   <div class=\"glass\" aria-hidden=\"true\"><\/div>\n  <\/div><\/div>\n  <div class=\"stage-foot\"><span><i class=\"key\"><\/i>LEFT SIDE <i class=\"key orange\" style=\"margin-left:14px\"><\/i> RIGHT SIDE <i class=\"key red\" style=\"margin-left:14px\"><\/i> REAR DANGER<\/span><span id=\"carCount\">0 CARS ON ROAD<\/span><\/div>\n  <section class=\"feedback feedback-wide\" id=\"hapticPanel\"><div class=\"vents\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div><div class=\"haptic-main\"><div class=\"eyebrow\">CURRENT SYSTEM RESPONSE \u00b7 SIMULATED<\/div><h3 id=\"feedbackTitle\">No alert<\/h3><p id=\"feedbackText\">No simulated vehicle is inside a modelled sensing range.<\/p><div class=\"output-code\" id=\"feedbackCode\">SIMULATED OUTPUT \u00b7 NO HARDWARE CONNECTED<\/div><div class=\"sim-disclaimer\">MODEL OUTPUT ONLY \u00b7 PWM values are requested software levels, not measured vibration intensity or physical pin output.<\/div><\/div>\n   <div class=\"haptic-readouts\"><div class=\"haptic-unit\"><span>LEFT VIBRATION REQUEST<\/span><strong id=\"leftOutput\">OFF \u00b7 PWM 0<\/strong><\/div><div class=\"haptic-unit\"><span>RIGHT VIBRATION REQUEST<\/span><strong id=\"rightOutput\">OFF \u00b7 PWM 0<\/strong><\/div><div class=\"haptic-unit\"><span>BUZZER<\/span><strong id=\"buzzerOutput\">OFF<\/strong><\/div><div class=\"haptic-unit\"><span>REAR STATUS<\/span><strong id=\"rearOutput\">CLEAR<\/strong><\/div><div class=\"haptic-unit\"><span>TURN INDICATOR<\/span><strong id=\"ledOutput\">OFF<\/strong><\/div><div class=\"haptic-unit\"><span>NEAREST TTC<\/span><strong id=\"ttcOutput\">\u2014<\/strong><\/div><div class=\"haptic-unit\"><span>VEHICLES IN RANGE<\/span><strong id=\"radarOutput\">0 TARGETS<\/strong><\/div><\/div>\n  <\/section>\n <\/section>\n <aside class=\"side-card\">\n  <div class=\"vents\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n  <div class=\"side-head\"><h2>Rider controls<\/h2><span id=\"selectionStatus\">NO SELECTION<\/span><\/div>\n  <div class=\"signal-control\"><div class=\"signal-row\"><label>Turn signal<\/label><span class=\"number\" id=\"signalStatus\">OFF<\/span><\/div><div class=\"indicator-options\"><button class=\"ghost active\" data-signal=\"off\">Off<\/button><button class=\"ghost\" data-signal=\"left\">\u2190 Left<\/button><button class=\"ghost\" data-signal=\"right\">Right \u2192<\/button><\/div><div class=\"control-note\">A vehicle on the indicated side triggers a simulated turn-conflict warning. This rule model is not a safety guarantee.<\/div><\/div>\n  <div class=\"control\"><div class=\"control-head\"><label>Selected vehicle distance<\/label><span class=\"number\" id=\"selectedDistance\">\u2014 cm<\/span><\/div><input class=\"range\" id=\"moveRange\" type=\"range\" min=\"20\" max=\"800\" step=\"10\" value=\"180\" disabled aria-label=\"Selected vehicle distance in centimetres\"><div class=\"range-labels\"><span>20 cm / VERY CLOSE<\/span><span>800 cm / SENSOR LIMIT<\/span><\/div><div class=\"control-note\">Side model range: 600 cm; rear model range: 800 cm. Distances are simulated vehicle positions, not sensor measurements.<\/div><\/div><div class=\"control\"><div class=\"control-head\"><label>Selected vehicle relative speed<\/label><span class=\"number\" id=\"speedValue\">20 km/h closing<\/span><\/div><input class=\"range\" id=\"speedRange\" type=\"range\" min=\"-60\" max=\"60\" step=\"5\" value=\"20\" disabled aria-label=\"Selected vehicle relative speed in kilometres per hour\"><div class=\"range-labels\"><span>\u221260 / RECEDING<\/span><span>+60 / CLOSING<\/span><\/div><div class=\"control-note\">Positive = moving closer; negative = moving away. TTC is calculated only for closing targets.<\/div><\/div><div class=\"control\"><div class=\"control-head\"><label>Scenario presets<\/label><span class=\"number\">SCENARIOS<\/span><\/div><div class=\"preset-grid\"><button class=\"ghost preset\" data-preset=\"mixed\">Mixed traffic<\/button><button class=\"ghost preset\" data-preset=\"left-turn\">Left turn conflict<\/button><button class=\"ghost preset\" data-preset=\"rear-approach\">Fast rear approach<\/button><button class=\"ghost preset\" data-preset=\"both-sides\">Both sides + rear<\/button><\/div><\/div>\n  <div class=\"carlist-wrap\"><div class=\"control-head\"><label>Vehicles in scene<\/label><span class=\"number\" id=\"trafficCount\">0 OBJECTS<\/span><\/div><div class=\"car-list\" id=\"carList\"><div class=\"empty-list\">Nothing on the road yet. Add vehicle to set up your first test.<\/div><\/div><\/div>\n <\/aside>\n<\/div>\n<div class=\"lower\">\n <section class=\"lower-card\"><div class=\"vents\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div><div class=\"lower-head\"><h2>Alert logic<\/h2><span>RULESET / V2<\/span><\/div><div class=\"table-wrap\"><table class=\"zone-table\"><thead><tr><th>Zone<\/th><th>Distance / condition<\/th><th>Feedback<\/th><\/tr><\/thead><tbody>\n <tr id=\"row-critical\"><td><span class=\"zone-chip\">03 / REAR DANGER<\/span><\/td><td>Rear vehicle \u2264 180 cm (rear sensing reach: 800 cm)<\/td><td>Both vibration requests MAX \u00b7 buzzer ON<\/td><\/tr>\n <tr id=\"row-intent\"><td><span class=\"zone-chip\">02 / TURN CONFLICT<\/span><\/td><td>Left/right indicator ON + vehicle on indicated side \u2264 600 cm<\/td><td>Buzzer ON \u00b7 both vibration requests MAX<\/td><\/tr>\n <tr id=\"row-side-critical\"><td><span class=\"zone-chip\">03 / SIDE CRITICAL<\/span><\/td><td>20\u2013199 cm on either side<\/td><td>Matching-side maximum request (255)<\/td><\/tr>\n <tr id=\"row-immediate\"><td><span class=\"zone-chip\">02 / CLOSE<\/span><\/td><td>200\u2013399 cm<\/td><td>Matching-side strong request (200)<\/td><\/tr>\n <tr id=\"row-ambient\"><td><span class=\"zone-chip\">01 / TRACK<\/span><\/td><td>400\u2013600 cm<\/td><td>Matching-side gentle request (75)<\/td><\/tr>\n <tr id=\"row-safe\"><td><span class=\"zone-chip\">00 / CLEAR<\/span><\/td><td>No side target \u2264 600 cm and no rear target \u2264 800 cm<\/td><td>Side outputs OFF; critical overrides handled separately<\/td><\/tr>\n <\/tbody><\/table><\/div><\/section>\n <section class=\"lower-card\"><div class=\"vents\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div><div class=\"lower-head\"><h2>Automated rule checks<\/h2><span id=\"testSummary\">NOT RUN<\/span><\/div><p class=\"test-intro\">Deterministic checks of the browser rule engine. These verify software logic only\u2014not sensor accuracy, real-world detection, or hardware response.<\/p><div class=\"test-actions\"><button class=\"add-btn\" id=\"runTests\">Run all rule tests<\/button><button class=\"ghost\" id=\"clearTests\">Clear results<\/button><\/div><div id=\"testResults\" class=\"test-results\"><div class=\"empty-list\">No tests run yet. Run the suite to check the rule logic.<\/div><\/div><div class=\"lower-head log-heading\"><h2>Event log<\/h2><span>SESSION LOG<\/span><\/div><button class=\"log-toggle\" id=\"logToggle\" aria-expanded=\"false\" aria-controls=\"log\">Show session events<\/button><div class=\"log\" id=\"log\" role=\"log\" aria-live=\"polite\" hidden>Roadroom simulation initialised.<\/div><\/section>\n<\/div>\n<footer class=\"footer\"><span>IBAS / Classroom prototype<\/span><span>Simulation logic only \u00b7 Not road-certified<\/span><span>All distances are simulated<\/span><\/footer>\n<\/div>\n<div class=\"modal-backdrop\" id=\"modalBackdrop\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modalTitle\">\n <div class=\"modal\">\n  <div class=\"modal-top\"><div class=\"eyebrow\" id=\"modalStep\">STEP 01 / POSITION<\/div><button class=\"secondary\" id=\"closeModal\" aria-label=\"Close\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M18 6 6 18M6 6l12 12\"/><\/svg><\/button><\/div>\n  <h2 id=\"modalTitle\">Where is the vehicle?<\/h2><p id=\"modalDesc\">Choose the vehicle position and approximate starting distance.<\/p>\n  <div class=\"step-label\">01 / Position around the bicycle<\/div>\n  <div class=\"choices\" id=\"sideChoices\">\n   <button class=\"choice\" data-side=\"left\">\u2190 Left<span>Adjacent lane<\/span><\/button><button class=\"choice\" data-side=\"right\">Right \u2192<span>Adjacent lane<\/span><\/button><button class=\"choice\" data-side=\"rear\">Behind<span>Directly behind<\/span><\/button>\n  <\/div>\n  <div class=\"step-label\">02 / Starting distance band<\/div>\n  <div class=\"choices\" id=\"zoneChoices\">\n   <button class=\"choice\" data-zone=\"ambient\">Zone 1<span>400\u2013600 cm<\/span><\/button><button class=\"choice\" data-zone=\"immediate\">Zone 2<span>200\u2013399 cm<\/span><\/button><button class=\"choice\" data-zone=\"critical\">Zone 3<span>20\u2013199 cm<\/span><\/button>\n  <\/div>\n  <div class=\"modal-actions\"><button class=\"secondary\" id=\"cancelAdd\">Cancel<\/button><button class=\"primary\" id=\"confirmAdd\">Place vehicle <svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M7 7h10v10M7 17 17 7\"/><\/svg><\/button><\/div>\n <\/div>\n<\/div>\n<div class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>\n<script>\nconst $=id=>document.getElementById(id);\nlet cars=[],nextId=1,selectedId=null,addSide=null,addZone=null,indicator='off',running=false,lastTick=0,raf=0,radarNodes=[];\nlet logLines=[];\nconst SIDE_RANGE=600,REAR_RANGE=800,REAR_DANGER=180;\nconst zones={ambient:{min:400,max:600,label:'TRACK'},immediate:{min:200,max:399,label:'CLOSE'},critical:{min:20,max:199,label:'CRITICAL'}};\nconst clamp=(n,a,b)=>Math.max(a,Math.min(b,n));\nfunction time(){return new Date().toLocaleTimeString([], {hour12:false});}\nfunction log(msg){logLines.unshift(time()+'  '+msg);logLines=logLines.slice(0,18);$('log').textContent=logLines.join('\\n');}\nfunction toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1900);}\nfunction selected(){return cars.find(c=>c.id===selectedId)||null}\nfunction zoneFor(d){if(d<=199)return'critical';if(d<=399)return'immediate';if(d<=600)return'ambient';return'safe'}\nlet lastFocused=null;\nfunction addModalOpen(){lastFocused=document.activeElement;addSide=null;addZone=null;document.querySelectorAll('[data-side],[data-zone]').forEach(b=>b.classList.remove('chosen'));$('modalBackdrop').classList.add('open');$('closeModal').focus()}\nfunction closeModal(){$('modalBackdrop').classList.remove('open');if(lastFocused&&lastFocused.focus)lastFocused.focus() }\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('modalBackdrop').classList.contains('open'))closeModal();if(e.key==='Tab'&&$('modalBackdrop').classList.contains('open')){const els=[...$('modalBackdrop').querySelectorAll('button:not(:disabled),input:not(:disabled),[tabindex]:not([tabindex=\"-1\"])')];if(!els.length)return;const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});\n$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeModal()});\n$('logToggle').addEventListener('click',()=>{const open=$('logToggle').getAttribute('aria-expanded')!=='true';$('logToggle').setAttribute('aria-expanded',String(open));$('log').hidden=!open;$('logToggle').textContent=open?'Hide session events':'Show session events'});\n$('openAdd').addEventListener('click',addModalOpen);$('closeModal').addEventListener('click',closeModal);$('cancelAdd').addEventListener('click',closeModal);\ndocument.querySelectorAll('[data-side]').forEach(b=>b.addEventListener('click',()=>{addSide=b.dataset.side;document.querySelectorAll('[data-side]').forEach(x=>x.classList.toggle('chosen',x===b))}));\ndocument.querySelectorAll('[data-zone]').forEach(b=>b.addEventListener('click',()=>{addZone=b.dataset.zone;document.querySelectorAll('[data-zone]').forEach(x=>x.classList.toggle('chosen',x===b))}));\n$('confirmAdd').addEventListener('click',()=>{if(!addSide||!addZone){toast('Choose a position and a distance band first.');return}const z=zones[addZone],distance=Math.round(((z.min+z.max)/2)/10)*10;const car={id:nextId++,side:addSide,distance,closingKmh:addSide==='rear'?25:10};cars.push(car);selectedId=car.id;closeModal();render();log('VEHICLE '+car.id+' ADDED / '+addSide.toUpperCase()+' / '+distance+' CM / '+car.closingKmh+' KM/H CLOSING');toast('Vehicle added to the simulation.')});\n$('moveRange').addEventListener('input',()=>{const c=selected();if(!c)return;c.distance=+$('moveRange').value;render(false)});\n$('speedRange').addEventListener('input',()=>{const c=selected();if(!c)return;c.closingKmh=+$('speedRange').value;$('speedValue').textContent=Math.abs(c.closingKmh)+' km/h '+(c.closingKmh>0?'closing':c.closingKmh<0?'receding':'steady');evaluate();renderCars();});\ndocument.querySelectorAll('[data-signal]').forEach(b=>b.addEventListener('click',()=>{indicator=b.dataset.signal;document.querySelectorAll('[data-signal]').forEach(x=>x.classList.toggle('active',x===b));$('signalStatus').textContent=indicator.toUpperCase();log('TURN INDICATOR '+indicator.toUpperCase());evaluate()}));\n$('view2d').addEventListener('click',()=>setView(false));$('view3d').addEventListener('click',()=>setView(true));\nfunction setView(three){const scene=$('scene');scene.classList.toggle('is-3d',three);$('view2d').classList.toggle('active',!three);$('view3d').classList.toggle('active',three);if(three){scene.style.setProperty('--orbit-x','35deg');scene.style.setProperty('--orbit-y','-8deg');toast('Perspective view is a CSS perspective approximation\u2014not a 3D physics scene.')}else{scene.style.removeProperty('--orbit-x');scene.style.removeProperty('--orbit-y');scene.style.transform=''}log('VIEW CHANGED / '+(three?'PERSPECTIVE APPROXIMATION':'TOP-DOWN VIEW'))}\nlet dragging=false,lastX=0,lastY=0,orbitX=35,orbitY=-8,zoom=.92;const wrap=$('sceneWrap'),scene=$('scene');\nwrap.addEventListener('pointerdown',e=>{if(!scene.classList.contains('is-3d'))return;dragging=true;lastX=e.clientX;lastY=e.clientY;wrap.classList.add('orbiting');wrap.setPointerCapture(e.pointerId)});\nwrap.addEventListener('pointermove',e=>{if(!dragging)return;orbitY+=(e.clientX-lastX)*.45;orbitX=clamp(orbitX-(e.clientY-lastY)*.35,5,78);lastX=e.clientX;lastY=e.clientY;scene.style.setProperty('--orbit-x',orbitX+'deg');scene.style.setProperty('--orbit-y',orbitY+'deg')});\nfunction stopDrag(){dragging=false;wrap.classList.remove('orbiting')}wrap.addEventListener('pointerup',stopDrag);wrap.addEventListener('pointercancel',stopDrag);\nwrap.addEventListener('wheel',e=>{if(!scene.classList.contains('is-3d'))return;e.preventDefault();zoom=clamp(zoom+(e.deltaY<0?.04:-.04),.65,1.08);scene.style.transform='perspective(1000px) rotateX(var(--orbit-x,35deg)) rotateY(var(--orbit-y,-8deg)) scale('+zoom+')'},{passive:false});\nfunction carPosition(c){const h=$('scene').clientHeight||420;const topMin=185;const topMax=Math.max(topMin+30,h-55);let top=topMin+(clamp(c.distance,20,800)-20)/780*(topMax-topMin);let left=c.side==='left'?32:c.side==='right'?68:50;if(c.side==='rear')top=clamp(170+(c.distance/800)*(h-220),170,h-60);return{left,top}}\nfunction renderCars(){const layer=$('carsLayer');layer.innerHTML='';cars.forEach(c=>{const pos=carPosition(c),el=document.createElement('button');el.type='button';el.className='car '+c.side+(c.side==='rear'&&c.distance<=REAR_DANGER?' rear':'')+(c.id===selectedId?' selected':'');el.style.left=pos.left+'%';el.style.top=pos.top+'px';el.setAttribute('aria-label','Select simulated vehicle '+c.id);const id=document.createElement('span');id.className='car-id';id.textContent=(c.side==='rear'?'REAR':c.side.toUpperCase())+' \u00b7 '+Math.round(c.distance)+' cm';el.appendChild(id);el.addEventListener('click',()=>{selectedId=c.id;render()});layer.appendChild(el)});radarNodes.forEach(n=>n.remove());radarNodes=[];cars.forEach(c=>{const p=carPosition(c);const dot=document.createElement('div');dot.className='radar-dot';dot.style.left=p.left+'%';dot.style.top=p.top+'px';const lab=document.createElement('div');lab.className='radar-label';lab.style.left=p.left+'%';lab.style.top=p.top+'px';lab.textContent='R'+c.id+' '+Math.round(c.distance)+'cm / '+(c.closingKmh>0?'+':'')+c.closingKmh+'km/h';$('scene').append(dot,lab);radarNodes.push(dot,lab)})}\nfunction render(shouldLog=false){const c=selected();$('moveRange').disabled=!c;$('speedRange').disabled=!c;if(c){$('moveRange').value=clamp(c.distance,20,800);$('selectedDistance').textContent=Math.round(c.distance)+' cm';$('speedRange').value=c.closingKmh;$('speedValue').textContent=Math.abs(c.closingKmh)+' km/h '+(c.closingKmh>0?'closing':c.closingKmh<0?'receding':'steady')}else{$('selectedDistance').textContent='\u2014 cm';$('speedValue').textContent='\u2014'}$('carCount').textContent=cars.length+' VEHICLE'+(cars.length===1?'':'S')+' IN SCENE';$('trafficCount').textContent=cars.length+' VEHICLE'+(cars.length===1?'':'S');$('selectionStatus').textContent=c?'VEHICLE '+c.id+' SELECTED':'NO SELECTION';$('emptyHint').style.display=cars.length?'none':'block';const list=$('carList');list.innerHTML='';if(!cars.length)list.innerHTML='<div class=\"empty-list\">No vehicles in the scene. Add a vehicle or load a preset.<\/div>';cars.forEach(car=>{const item=document.createElement('div');item.className='car-item'+(car.id===selectedId?' selected':'');const info=document.createElement('div');info.className='car-info';const strong=document.createElement('strong');strong.textContent='Vehicle '+car.id+' \u00b7 '+(car.side==='rear'?'Behind':car.side[0].toUpperCase()+car.side.slice(1));const small=document.createElement('small');small.textContent=Math.round(car.distance)+' CM / '+Math.abs(car.closingKmh)+' KM/H '+(car.closingKmh>0?'CLOSING':car.closingKmh<0?'RECEDING':'STEADY');info.append(strong,small);const buttons=document.createElement('div');buttons.className='car-buttons';const pick=document.createElement('button');pick.className='mini';pick.textContent='Select';pick.onclick=()=>{selectedId=car.id;render()};const del=document.createElement('button');del.className='mini remove';del.textContent='\u00d7';del.title='Remove vehicle';del.onclick=()=>{cars=cars.filter(x=>x.id!==car.id);if(selectedId===car.id)selectedId=cars[0]?.id??null;log('VEHICLE '+car.id+' REMOVED');render()};buttons.append(pick,del);item.append(info,buttons);list.appendChild(item)});renderCars();evaluate()}\nfunction evaluate(sourceCars=cars,sourceIndicator=indicator){const inRange=sourceCars.filter(c=>(c.side==='rear'?c.distance<=REAR_RANGE:c.distance<=SIDE_RANGE));const left=inRange.filter(c=>c.side==='left'),right=inRange.filter(c=>c.side==='right'),rear=inRange.filter(c=>c.side==='rear');const minOf=a=>a.length?Math.min(...a.map(c=>c.distance)):Infinity;const leftMin=minOf(left),rightMin=minOf(right),rearMin=minOf(rear);const turnConflict=(sourceIndicator==='left'&&leftMin<=SIDE_RANGE)||(sourceIndicator==='right'&&rightMin<=SIDE_RANGE);const rearDanger=rearMin<=REAR_DANGER;const bandPWM=d=>d>SIDE_RANGE?0:d<=199?255:d<=399?200:75;let lp=bandPWM(leftMin),rp=bandPWM(rightMin),buzz='OFF',title='No alert.',desc='No simulated vehicle is inside its modelled sensing range.',rearStatus=rear.length?'TRACKING / '+Math.round(rearMin)+' CM':'CLEAR',activeRow='row-safe';\n// Simultaneous detections remain independent; global critical conditions override both haptics but do not hide side detections.\nif(turnConflict||rearDanger){lp=rp=255;buzz='ON \u00b7 '+(turnConflict&&rearDanger?'TURN + REAR CONFLICT':turnConflict?'TURN CONFLICT':'REAR DANGER');if(turnConflict&&rearDanger){title='Multiple critical conditions.';desc='A signalled-side conflict and a rear target within 180 cm are both present. Both simulated vibration channels are set to maximum and the buzzer is requested ON.'}else if(turnConflict){title='Turn conflict \u2014 do not manoeuvre.';desc='An in-range target is on the signalled side. Both simulated vibration channels are set to maximum and the buzzer is requested ON.'}else{title='Rear danger zone.';desc='A rear target is within 180 cm. Both simulated vibration channels are set to maximum and the buzzer is requested ON.'}activeRow=rearDanger?'row-critical':'row-intent'}else if(left.length||right.length||rear.length){const near=Math.min(leftMin,rightMin);if(left.length&&right.length){title='Targets on both sides.';desc='Left and right side targets are evaluated independently. Each side keeps its own distance-band output; rear tracking remains visible at the same time.'}else if(left.length||right.length){title='Side target detected.';desc='The nearest target determines that side\u2019s output; the opposite side remains independently evaluated.'}else{title='Rear target tracked.';desc='A rear target is inside the modelled 800 cm range. No rear danger alert is requested unless it is within 180 cm.'}if(near<=199)activeRow='row-side-critical';else if(near<=399)activeRow='row-immediate';else if(near<=600)activeRow='row-ambient';else activeRow='row-safe'}\nconst ttcTargets=inRange.filter(c=>c.closingKmh>0&&c.distance>0).map(c=>({c,ttc:c.distance/(c.closingKmh*100000/3600)})).sort((a,b)=>a.ttc-b.ttc);const nearestTTC=ttcTargets[0];$('feedbackTitle').textContent=title;$('feedbackText').textContent=desc;$('feedbackCode').textContent='SIMULATED REQUEST \u00b7 LEFT PWM '+lp+' \u00b7 RIGHT PWM '+rp+' \u00b7 BUZZER '+(buzz==='OFF'?'OFF':'ON');const out=p=>p===0?'OFF \u00b7 REQUEST 0':p===75?'GENTLE \u00b7 REQUEST 75':p===200?'STRONG \u00b7 REQUEST 200':'MAX \u00b7 REQUEST 255';$('leftOutput').textContent=out(lp);$('rightOutput').textContent=out(rp);$('leftOutput').className=lp?'alert':'ok';$('rightOutput').className=rp?'alert':'ok';$('buzzerOutput').textContent=buzz;$('buzzerOutput').className=buzz==='OFF'?'ok':'alert';$('ledOutput').textContent=sourceIndicator==='off'?'OFF':'SIMULATED '+sourceIndicator.toUpperCase();$('ledOutput').className=sourceIndicator==='off'?'ok':'alert';$('rearOutput').textContent=rearDanger?'DANGER \u2264 180 CM':rearStatus;$('rearOutput').className=rearDanger?'alert':'ok';$('ttcOutput').textContent=nearestTTC?nearestTTC.ttc.toFixed(1)+' s (V'+nearestTTC.c.id+')':'\u2014 / NO CLOSING TARGET';$('radarOutput').textContent=inRange.length+' / '+sourceCars.length+' IN RANGE';document.querySelectorAll('.zone-table tbody tr').forEach(x=>x.classList.remove('active'));$(activeRow).classList.add('active');return{lp,rp,buzz,turnConflict,rearDanger,leftMin,rightMin,rearMin,inRange,ttcTargets,activeRow}}\nfunction tick(ts){if(!running)return;if(!lastTick)lastTick=ts;const dt=Math.min((ts-lastTick)/1000,.2);lastTick=ts;let moved=false;cars.forEach(c=>{if(c.closingKmh!==0){const next=c.distance-c.closingKmh*27.7778*dt;if(next<20||next>800){c.closingKmh=0;c.distance=clamp(next,20,800);log('VEHICLE '+c.id+' REACHED SIMULATION BOUNDARY / SPEED SET TO STEADY')}else{c.distance=next}moved=true}});if(moved){render(false)}raf=requestAnimationFrame(tick)}\nfunction startStop(){running=!running;lastTick=0;$('runSim').textContent=running?'\u2161 Pause traffic':'\u25b6 Run traffic';$('runSim').classList.toggle('active',running);document.body.classList.toggle('sim-running',running);$('runStatus').textContent=running?'Traffic running':'Paused';if(running){log('TRAFFIC MOTION STARTED / VEHICLES MOVE AT SIMULATED RELATIVE SPEED');raf=requestAnimationFrame(tick)}else{cancelAnimationFrame(raf);log('TRAFFIC MOTION PAUSED')}}\n$('runSim').addEventListener('click',startStop);\nfunction stopTraffic(){running=false;cancelAnimationFrame(raf);$('runSim').textContent='\u25b6 Run traffic';$('runSim').classList.remove('active');document.body.classList.remove('sim-running');$('runStatus').textContent='Paused'}\nfunction clearVehicles(){stopTraffic();cars=[];selectedId=null;render();log('VEHICLES CLEARED / CONTROLS AND SIGNAL RETAINED');toast('Vehicles cleared.')}\n$('clearVehicles').addEventListener('click',clearVehicles);\n$('resetSim').addEventListener('click',()=>{if(!confirm('Reset the scene? This removes all vehicles and clears the turn signal.'))return;stopTraffic();cars=[];selectedId=null;indicator='off';document.querySelectorAll('[data-signal]').forEach(x=>x.classList.toggle('active',x.dataset.signal==='off'));$('signalStatus').textContent='OFF';render();log('FULL SIMULATION RESET / NO VEHICLES');toast('Simulation reset.')});\nfunction loadPreset(name){stopTraffic();const data={mixed:[['left',520,12],['right',330,22],['rear',540,35]],'left-turn':[['left',270,18]],'rear-approach':[['rear',650,55]],'both-sides':[['left',350,15],['right',460,25],['rear',260,35]]}[name]||[];cars=data.map(([side,distance,closingKmh])=>({id:nextId++,side,distance,closingKmh}));selectedId=cars[0]?.id??null;indicator=name==='left-turn'?'left':'off';document.querySelectorAll('[data-signal]').forEach(x=>x.classList.toggle('active',x.dataset.signal===indicator));$('signalStatus').textContent=indicator.toUpperCase();render();log('SCENARIO LOADED / '+name.toUpperCase().replaceAll('-',' ')+' / '+cars.length+' VEHICLES');toast('Scenario loaded. Press Run traffic to animate.');}\ndocument.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>loadPreset(b.dataset.preset)));\n// Pure rule function used by both live display and automated tests.\nfunction ruleSnapshot(testCars,testIndicator='off'){return evaluate(testCars,testIndicator)}\nfunction runTests(){const cases=[\n{name:'Empty scene is quiet',cars:[],signal:'off',check:r=>r.lp===0&&r.rp===0&&r.buzz==='OFF'},\n{name:'Left track band: gentle left only',cars:[{id:1,side:'left',distance:500,closingKmh:0}],signal:'off',check:r=>r.lp===75&&r.rp===0&&r.buzz==='OFF'},\n{name:'Close side band: strong matching side',cars:[{id:1,side:'right',distance:300,closingKmh:0}],signal:'off',check:r=>r.rp===200&&r.lp===0},\n{name:'Critical side band: maximum matching side',cars:[{id:1,side:'left',distance:100,closingKmh:0}],signal:'off',check:r=>r.lp===255&&r.rp===0},\n{name:'Outside side range is not a side detection',cars:[{id:1,side:'left',distance:700,closingKmh:0}],signal:'off',check:r=>r.lp===0&&r.inRange.length===0},\n{name:'Matching indicator creates turn conflict',cars:[{id:1,side:'left',distance:500,closingKmh:0}],signal:'left',check:r=>r.turnConflict&&r.lp===255&&r.rp===255&&r.buzz!=='OFF'},\n{name:'Opposite-side vehicle does not trigger turn conflict',cars:[{id:1,side:'right',distance:300,closingKmh:0}],signal:'left',check:r=>!r.turnConflict&&r.lp===0&&r.rp===200&&r.buzz==='OFF'},\n{name:'Rear danger overrides both outputs',cars:[{id:1,side:'rear',distance:150,closingKmh:20}],signal:'off',check:r=>r.rearDanger&&r.lp===255&&r.rp===255&&r.buzz!=='OFF'},\n{name:'Side + rear detections coexist',cars:[{id:1,side:'left',distance:500,closingKmh:0},{id:2,side:'rear',distance:500,closingKmh:10}],signal:'off',check:r=>r.lp===75&&r.rp===0&&r.inRange.length===2},\n{name:'Both side channels are independently represented',cars:[{id:1,side:'left',distance:300,closingKmh:0},{id:2,side:'right',distance:500,closingKmh:0}],signal:'off',check:r=>r.lp===200&&r.rp===75},\n{name:'TTC only for a closing target',cars:[{id:1,side:'rear',distance:500,closingKmh:36}],signal:'off',check:r=>r.ttcTargets.length===1&&Math.abs(r.ttcTargets[0].ttc-5)<.01},\n{name:'Receding target has no TTC',cars:[{id:1,side:'rear',distance:500,closingKmh:-20}],signal:'off',check:r=>r.ttcTargets.length===0}\n];const results=cases.map(t=>{const r=ruleSnapshot(t.cars,t.signal);let pass=false;try{pass=!!t.check(r)}catch(e){}return{...t,pass}});const pass=results.filter(x=>x.pass).length;evaluate(cars,indicator);$('testSummary').textContent=pass+'/'+results.length+' PASS';$('testResults').innerHTML='';results.forEach(t=>{const d=document.createElement('div');d.className='test-result';const info=document.createElement('div'),strong=document.createElement('strong'),small=document.createElement('small'),badge=document.createElement('span');strong.textContent=t.name;small.textContent='Signal: '+t.signal.toUpperCase()+' \u00b7 '+t.cars.length+' vehicle(s)';info.append(strong,small);badge.className=t.pass?'pass':'fail';badge.textContent=t.pass?'PASS':'FAIL';d.append(info,badge);$('testResults').appendChild(d)});log('AUTOMATED RULE CHECKS / '+pass+'/'+results.length+' PASS / '+(results.length-pass)+' FAIL');toast(pass===results.length?'All rule checks passed.':'Some rule checks failed. Review the results.');}\n$('runTests').addEventListener('click',runTests);$('clearTests').addEventListener('click',()=>{$('testSummary').textContent='NOT RUN';$('testResults').innerHTML='<div class=\"empty-list\">No tests run yet. Run the suite to check the rule logic.<\/div>';log('TEST RESULTS CLEARED')});\nlogLines=['ROADROOM SIMULATION MODEL INITIALISED','Model ranges: side 600 cm / rear 800 cm / rear danger 180 cm.','No physical sensor, buzzer or vibration motor is connected.'];$('log').textContent=logLines.join('\\n');render();\n<\/script>\n"};
